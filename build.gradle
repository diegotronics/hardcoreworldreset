plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

loom {
	accessWidenerPath = file("src/main/resources/hardcoreworldreset.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	// The player-facing texts use accents and symbols; never depend on the platform charset
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

// The same sounds that ship inside the jar, packaged as a server resource pack so clients
// that do not have the mod installed hear them too (see resourcepack/README.md).
tasks.register('resourcePack', Zip) {
	group = 'build'
	description = 'Packs the custom sounds as a resource pack for clients without the mod'
	archiveFileName = "hardcoreworldreset-resourcepack-${project.version}.zip"
	destinationDirectory = layout.buildDirectory.dir('libs')
	from('resourcepack') {
		exclude 'README.md'
	}
	from('src/main/resources/assets') {
		into 'assets'
	}
	from('src/main/resources/assets/hardcoreworldreset/icon.png') {
		rename { 'pack.png' }
	}
}

tasks.named('build') {
	dependsOn 'resourcePack'
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}